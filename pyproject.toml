[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spotforecast"
version = "0.1.0"
description = "Day-ahead forecasting of the German electricity spot price"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2,<3",  # preprocessing relies on pytz timezones (tz.localize)
    "pyarrow",
    "scikit-learn",
    "torch",
    "tensorboard",
    "matplotlib",
    "holidays",  # public holidays of the German states for the calendar features
    "lightgbm",  # model v2 and the second model of the feature selection
    "optuna",  # hyperparameter search
    "openpyxl",  # the EEX auction reports (xlsx) of the fuel prices
    "xlrd",  # the older EEX auction reports (xls)
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
