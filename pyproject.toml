[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spotforecast"
version = "0.1.0"
description = "48h day-ahead forecasting of the German electricity spot price"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2,<3",  # preprocessing relies on pytz timezones (tz.localize)
    "pyarrow",
    "scikit-learn",
    "torch",
    "tensorboard",
    "plotly",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
