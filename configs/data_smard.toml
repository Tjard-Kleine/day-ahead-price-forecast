# The SMARD.de data of phase 2: hourly, October 2018 to the download date (python -m spotforecast.data.smard).
# Every column is described in data/README.md. A model config uses this data with data = "data_smard"

path = "data/raw/smard.parquet"

[preprocessing]
datetime_col = "Date"
data_interpolation_method = "linear"
# train: October 2018 to March 2024; validation: April 2024 to March 2025, a whole year with every season (it
# contains the test quarter of phase 1, which is no problem for a new model); test: April 2025 to the end of the
# data, untouched until the final evaluation of model v2
valid_cutoff_datetime = "2024-04-01 00:00:00"
test_cutoff_datetime = "2025-04-01 00:00:00"

# expected update frequency of each column, limits how far missing values are forward-filled; the data is hourly
[preprocessing.resolution_map]
"Spot" = "hour"
"conso" = "hour"
"pumped storage consumption" = "hour"
"onshore wind" = "hour"
"offshore wind" = "hour"
"solar" = "hour"
