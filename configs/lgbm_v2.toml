# LightGBM of model v2 (step V6 of ROADMAP.md): gradient boosted trees on the SMARD data, one model for all hours of
# day D (fit_lgbm in src/spotforecast/models/baselines.py). Its features are the choice of the forward selection of V4:
# the base of configs/feature_selection_v2.toml and the groups neighbour_prices and austria. The same information set
# as configs/lstm_v2.toml, only what is known at 12:00 on D-1.
# Evaluated together with the LSTM: python -m spotforecast.evaluate --ensemble --config lstm_v2 --lgbm lgbm_v2

model_name = "lgbm_v2"
data = "data_smard"

# history features: the prices of D-1 in Germany and in the coupled neighbouring markets, the forecasts
features = ["Spot", "forecast residual load",
            "price AT", "price BE", "price CH", "price CZ", "price DK1", "price FR", "price NL",
            "AT forecast load", "AT forecast onshore wind", "AT forecast solar"]
# inputs of day D: only day-ahead forecasts
targets = ["Spot", "forecast residual load", "AT forecast load", "AT forecast onshore wind", "AT forecast solar"]

# the window of the LSTM, so that both forecast the same days; LightGBM itself uses the last 168 hours of it
forecast_history = 192
forecast_horizon = 24
exclude_days = []

# the mean forecast of one model per seed (they differ in the subsampled rows and columns)
seeds = [1, 2, 3]

# trial 48 of the search python -m spotforecast.tune_lgbm (logs/optuna_lgbm_v2.log), exactly as it was confirmed with
# 3 seeds: 13.43 EUR/MWh on the validation year against 13.93 with the settings of the feature selection (LGBM_PARAMS),
# every seed at least 0.5 better. More and slower trees with more leaves, stronger subsampling of the rows and some L2
# regularization. Not rounded: rounded to 3 digits the subsamples change and the MAE is about 13.5
[params]
n_estimators = 1105
learning_rate = 0.022340188465578614
num_leaves = 122
min_child_samples = 6
subsample = 0.6867119942978767
colsample_bytree = 0.9231544244272338
reg_lambda = 2.0240598520556343
objective = "regression"
