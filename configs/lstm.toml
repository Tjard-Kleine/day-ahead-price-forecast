# LSTM model for the day-ahead forecast of the German spot price: at 12:00 on day D-1, the day of the auction,
# the 24 hourly prices of day D are forecast

model_name = "energy_lstm"

# history features, the window ends at midnight before day D; "Spot" must stay first, the model uses it as residual anchor.
# At 12:00 on D-1 the prices of all of D-1 are known (auction on D-2); wind, solar, load and the weather of the afternoon
# of D-1 count as perfect forecasts. Values without a day-ahead forecast are shifted by 12 hours ("_lag12"), daily prices
# by 24 hours ("_lag24"), see src/spotforecast/data/features.py.
# Selected in step 5 of the roadmap: the six base features plus the groups calendar, residual_load, renewables and fuel
# of configs/feature_selection.toml
features = ["Spot", "solar", "solar_mean", "wind_mean", "onshore wind", "solar capacity",
            "saturday", "sunday", "holiday", "residual load", "offshore wind",
            "Spot Gas EEX THE Day Ahead_lag24", "Spot coal_lag24", "CO2 price GER_lag24"]
# the first entry is the forecast target, the others are covariates known for day D. The weather, wind, solar and the
# residual load of day D are measured values used as perfect day-ahead forecasts, so the results are an upper bound
# for real forecasts
targets = ["Spot", "wind_mean", "solar_mean", "saturday", "sunday", "holiday", "residual load",
           "onshore wind", "offshore wind", "solar"]

forecast_history = 192
# the hours of day D, days with a clock change are skipped
forecast_horizon = 24
# forecast days that are no training targets because their prices are no market outcome: on 2024-06-26 a technical
# failure at EPEX SPOT decoupled the German market from the European day-ahead market coupling (SDAC) and the prices
# reached 2326 EUR/MWh. Added after the final model of phase 1, which was trained with this day
exclude_days = ["2024-06-26"]
batch_size = 64

# training settings of step 4: lr 1e-3 with early stopping, Huber loss and zero_init_output
lr = 1e-3
weight_decay = 1e-4
epochs = 300
# stop after this many epochs without a better validation loss, 0 trains all epochs
early_stopping_patience = 20
# training loss, "mse" or "huber"; huber_delta is in the scaled space, 1 is about 39 EUR/MWh
loss = "huber"
huber_delta = 1.0
# fixed for reproducibility, vary it (train --seed) to measure the run-to-run noise
seed = 1

[net_params]
hidden_dim = 256
dropout_p = 0.5
num_layers = 3
bidirectional = false
# true: the untrained model starts at persistence (the last known price)
zero_init_output = true
