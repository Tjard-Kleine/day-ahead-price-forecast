# Data source and preprocessing of the raw 15-min data into hourly time steps

path = "data/raw/energy_ger.parquet"

[preprocessing]
datetime_col = "Date"
data_interpolation_method = "linear"
# train: everything before valid_cutoff_datetime, validation: up to test_cutoff_datetime, test: the rest
# models and features are only compared on the validation split, the test split is evaluated once at the very end
valid_cutoff_datetime = "2024-10-01 00:00:00"
test_cutoff_datetime = "2025-01-01 00:00:00"

# expected update frequency of each column, limits how far missing values are forward-filled
[preprocessing.resolution_map]
"Spot" = "hour"
"pumped hydro conso" = "hour"
"cross-border trade" = "hour"
"nuclear" = "hour"
"run-of-the-river production" = "hour"
"biomass" = "hour"
"brown coal" = "hour"
"black coal" = "hour"
"oil" = "hour"
"natural gas" = "hour"
"geothermal" = "hour"
"stored hydro production" = "hour"
"pumped hydro production" = "hour"
"other" = "hour"
"waste incineration" = "hour"
"offshore wind" = "hour"
"onshore wind" = "hour"
"solar" = "hour"
"conso" = "skip"
"coal gas" = "hour"
"CO2 price GER" = "week"
"CO2 price EU" = "week"
"biomass capacity" = "month"
"offshore wind capacity" = "month"
"onshore wind capacity" = "month"
"solar capacity" = "month"
"battery storage (nominal power)" = "month"
"pumped hydro capacity" = "year"
"brown coal capacity" = "year"
"black coal capacity" = "year"
"oil capacity" = "year"
"natural gas capacity" = "year"
"other (non-renewable) capacity" = "year"
"Spot Gas EEX THE Day Ahead" = "week"
"Spot coal" = "week"
"wind_mean" = "hour"
"solar_mean" = "hour"

# aggregation of the 15-min rows into hourly values
[preprocessing.aggregation_methods_map]
"Spot" = "mean"  # hourly price repeated in every quarter hour
"pumped hydro conso" = "sum"
"cross-border trade" = "sum"
"nuclear" = "sum"
